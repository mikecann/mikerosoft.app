name: Deploy Website

on:
  push:
    branches:
      - main
  # Each tool lives in its own repo (github.com/mikecann/<tool>). The build
  # clones them for the dates and changelogs, so a daily build picks up
  # whatever was pushed to them. Run it by hand to publish a change sooner.
  schedule:
    - cron: '0 22 * * *' # 06:00 in Perth
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
